<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Newspaper design previews | Vox Deorum</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/fonts.css" />
    <style>
      body { margin: 0; color: #222; background: #f7f7f7; font: 16px system-ui, sans-serif; }
      .preview-controls { max-width: 75rem; margin: auto; padding: 1rem; }
      .preview-controls h1 { margin: 0; font-size: 1.25rem; }
      .preview-controls p { margin: .5rem 0 1rem; }
      .preview-options { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; }
      .preview-options label { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; max-width: 100%; }
      .preview-options select { max-width: 100%; padding: .35rem; font: inherit; }
    </style>
  </head>
  <body>
    <header class="preview-controls">
      <h1>Newspaper design previews</h1>
      <p>Compare built-in designs using sample stories. Layout changes apply to the front page.</p>
      <div class="preview-options">
        <label>Design <select id="preview-design"></select></label>
        <label>Front page layout <select id="preview-layout"></select></label>
      </div>
      <p id="preview-error" role="alert" hidden></p>
    </header>
    <main id="preview-reader" aria-label="Sample newspaper"></main>
    <script type="module" src="/src/preview/main.ts"></script>
  </body>
</html>
