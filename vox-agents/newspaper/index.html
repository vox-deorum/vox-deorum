<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Newspaper preview | Vox Deorum</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/fonts.css" />
  </head>
  <body>
    <header class="host-toolbar">
      <div class="host-toolbar-row">
        <h1>Newspaper preview</h1>
        <div class="host-mode" role="group" aria-label="Newspaper source">
          <button id="mockups-mode" type="button" aria-pressed="true">Mockups</button>
          <button id="recorded-mode" type="button" aria-pressed="false">Recorded</button>
        </div>
      </div>
      <div id="mockup-controls">
        <div class="host-toolbar-row">
          <label>Design <select id="preview-design"></select></label>
          <label>Front page layout <select id="preview-layout"></select></label>
          <label>Tint <select id="preview-tint"></select></label>
          <label>Custom tint <input id="preview-custom-tint" type="color" value="#6d2c91" /></label>
        </div>
        <p id="preview-error" class="host-error" role="alert" hidden></p>
      </div>
      <div id="recorded-controls" hidden>
        <div class="host-toolbar-row">
          <label>Edition <select id="recorded-edition" disabled><option value="">No editions yet</option></select></label>
          <button id="replay-generate" type="submit" form="replay-form">Generate</button>
          <button id="replay-continue" type="button" hidden>Continue</button>
          <button id="replay-stop" type="button" hidden>Stop after current check</button>
          <output id="replay-status" aria-live="polite">Choose a recording to generate editions.</output>
        </div>
        <details id="recording-details" class="host-recording">
          <summary>Recording</summary>
          <form id="replay-form" class="host-replay">
            <fieldset class="host-fields" aria-label="Recording and turn range">
              <label>Recording database <input name="databasePath" required placeholder="F:\recordings\game.db" /></label>
              <label>Player ID <input name="receiverPlayerID" type="number" min="0" max="21" value="0" required /></label>
              <label>First turn <input name="fromTurn" type="number" min="0" required /></label>
              <label>Last turn <input name="toTurn" type="number" min="0" required /></label>
            </fieldset>
            <details class="host-advanced">
              <summary>Saved run</summary>
              <fieldset class="host-fields" aria-label="Saved run">
                <label>Run ID <input name="runId" placeholder="Required to resume" /></label>
                <label>Output path <input name="outputPath" placeholder="Optional publication store" /></label>
                <button id="replay-resume" type="submit" formnovalidate>Resume</button>
              </fieldset>
            </details>
            <details class="host-advanced">
              <summary>Advanced</summary>
              <fieldset class="host-fields" aria-label="Advanced settings">
                <label>Replay purpose <select name="publicationEnabled"><option value="true">Generate editions</option><option value="false">Inspect evidence only</option></select></label>
                <label data-evidence-interval hidden>Evidence check interval <input name="publicationInterval" type="number" min="1" value="5" required /></label>
                <label>Comparison duration <input name="comparisonTurns" type="number" min="0" value="10" required /></label>
                <label>Duration units <select name="durationUnit"><option value="recordedTurns">Recorded turns</option><option value="standardTurns">Standard pace turns</option></select></label>
                <label>Speed multiplier override <input name="speedMultiplierOverride" type="number" min="0.01" step="any" placeholder="Optional" /></label>
                <label>Mode <select name="mode"><option value="new">New run</option><option value="branch">Branch run</option></select></label>
                <label>Branch from run ID <input name="branchFromRunId" placeholder="Required to branch" disabled /></label>
                <label>Editorial config directory <input name="editorialConfigDirectory" placeholder="Optional configuration folder" /></label>
                <label>Publication frequency (standard turns) <input name="frequencyStandardTurns" type="number" min="1" placeholder="Catalogue default" /></label>
                <label>Allow LLM when available <select name="llmEnabled"><option value="">Use catalogue default</option><option value="false">No</option><option value="true">Yes</option></select></label>
                <button type="button" data-replay="save-preferences" disabled>Save preferences</button>
              </fieldset>
            </details>
          </form>
        </details>
        <p class="host-error" data-replay-error role="alert" hidden></p>
      </div>
    </header>
    <p id="reader-note" role="status"></p>
    <main>
      <div id="reader-root" aria-label="Newspaper edition"></div>
      <details id="replay-diagnostics" class="host-diagnostics" hidden>
        <summary>Replay diagnostics</summary>
        <div class="host-diagnostic-sections">
          <section>
            <h2>Skipped checks in this batch</h2>
            <div id="check-view"></div>
          </section>
          <section>
            <h2>Selected edition</h2>
            <div id="page-items"></div>
            <div id="decision-view"></div>
          </section>
          <section>
            <h2>Evidence at the current cutoff</h2>
            <button type="button" data-replay="inspect" disabled>Inspect cutoff</button>
            <div id="evidence-view"></div>
          </section>
        </div>
      </details>
    </main>
    <noscript>The newspaper preview needs JavaScript enabled.</noscript>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
